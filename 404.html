<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script>
        var anchor = document.createElement("a");
        anchor.href = window.location.href;
        
        var path = anchor.pathname;
        if (path.indexOf(".html") === -1) {
            path = path.replace(//$/, "");
            path = path + ".html";
        }
        
        var pathParts = path.split("/");
        var version = pathParts[1];
        var lang = version === "undefined" ? pathParts[2] : pathParts[1];
        var supportedLanguages = ["en","zh-CN"];
        
        var versionPrefix = "";
        
        if (supportedLanguages.includes(lang)) {
            window.location.replace(versionPrefix + "/" + lang + "/404.html");
        } else {
            window.location.replace(versionPrefix + "/zh-CN/404.html");
        }
    </script>
</head>
<body></body>
</html>
